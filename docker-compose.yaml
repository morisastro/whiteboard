services:
  s3:
    image: chrislusf/seaweedfs:3.99
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: wbadmin
      AWS_SECRET_ACCESS_KEY: gTRVmCxU0SaOviAtc6WhMqJ8
    command: >-
      server -dir=/data -filer
      -master.volumeSizeLimitMB=2048
      -s3 -s3.port=8333
    volumes:
      - s3-data:/data

  whiteboard:
    build: .
    restart: unless-stopped
    depends_on:
      - s3
    environment:
      PORT: 3000
      STORAGE: s3
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: whiteboard
      S3_REGION: us-east-1
      S3_ACCESS_KEY: wbadmin
      S3_SECRET_KEY: gTRVmCxU0SaOviAtc6WhMqJ8
      AUTH_USER: admin
      AUTH_PASS: ${AUTH_PASS}

volumes:
  s3-data:
