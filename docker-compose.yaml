services:
  s3-init:
    image: chrislusf/seaweedfs:3.99
    restart: "no"
    entrypoint: /bin/sh
    command: -c "echo 'eyJpZGVudGl0aWVzIjpbeyJuYW1lIjoiYWRtaW4iLCJhY2Nlc3NLZXkiOiJ3YmFkbWluIiwic2VjcmV0S2V5IjoiZ1RSVm1DeFUwU2FPdmlBdGM2V2hNcUo4IiwiYWN0aW9ucyI6WyJBZG1pbiIsIlJlYWQiLCJXcml0ZSIsIkxpc3QiLCJUYWdnaW5nIl19XX0=' | base64 -d > /cfg/s3.json"
    volumes:
      - s3-cfg:/cfg

  s3:
    image: chrislusf/seaweedfs:3.99
    restart: unless-stopped
    depends_on:
      - s3-init
    command: >-
      server -dir=/data -filer
      -master.volumeSizeLimitMB=2048
      -s3 -s3.port=8333
      -s3.config=/cfg/s3.json
    volumes:
      - s3-data:/data
      - s3-cfg:/cfg:ro

  whiteboard:
    build: .
    restart: unless-stopped
    depends_on:
      - s3
    environment:
      PORT: 3000
      STORAGE: s3
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: whiteboard
      S3_REGION: us-east-1
      S3_ACCESS_KEY: wbadmin
      S3_SECRET_KEY: gTRVmCxU0SaOviAtc6WhMqJ8
      AUTH_USER: admin
      AUTH_PASS: ${AUTH_PASS}

volumes:
  s3-data:
  s3-cfg:
