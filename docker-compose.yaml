services:
  s3:
    image: chrislusf/seaweedfs:3.99
    restart: unless-stopped
    command: >-
      server -dir=/data -filer
      -master.volumeSizeLimitMB=2048
      -s3 -s3.port=8333
      -s3.accessKey=${S3_ACCESS_KEY}
      -s3.secretKey=${S3_SECRET_KEY}
    volumes:
      - s3-data:/data

  whiteboard:
    build: .
    restart: unless-stopped
    depends_on:
      - s3
    environment:
      PORT: 3000
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AUTH_USER: ${AUTH_USER}
      AUTH_PASS: ${AUTH_PASS}

volumes:
  s3-data:
