<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whiteboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128397;&#65039;</text></svg>" />
</head>
<body>
  <div id="toolbar">
    <div class="group">
      <select id="boardSelect" title="Wybierz board">
        <option value="">— nowy board —</option>
      </select>
      <button id="btnLoad" title="Wczytaj wybrany board">Wczytaj</button>
      <button id="btnDelete" title="Usuń wybrany board">Usuń</button>
    </div>
    <div class="group">
      <input id="boardName" type="text" placeholder="nazwa-boardu" maxlength="64" spellcheck="false" />
      <button id="btnSave" title="Zapisz do bucketa">Zapisz</button>
    </div>
    <div class="group">
      <button id="btnPen" class="tool active" title="Długopis">&#9998;&#65039;</button>
      <button id="btnEraser" class="tool" title="Gumka">&#129529;</button>
      <div id="colors">
        <button class="swatch active" data-color="#1e1e2e" style="background:#1e1e2e"></button>
        <button class="swatch" data-color="#e5484d" style="background:#e5484d"></button>
        <button class="swatch" data-color="#f5a623" style="background:#f5a623"></button>
        <button class="swatch" data-color="#30a46c" style="background:#30a46c"></button>
        <button class="swatch" data-color="#0090ff" style="background:#0090ff"></button>
      </div>
      <input id="width" type="range" min="1" max="30" value="3" title="Grubość" />
      <button id="btnUndo" title="Cofnij">&#8630;</button>
      <button id="btnClear" title="Wyczyść">&#128465;&#65039;</button>
      <button id="btnPng" title="Pobierz PNG">PNG</button>
    </div>
    <span id="status"></span>
  </div>
  <div id="canvasWrap">
    <canvas id="canvas"></canvas>
  </div>
  <script src="app.js"></script>
</body>
</html>
